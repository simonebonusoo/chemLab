services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - chemistry-engine
    environment:
      # Demo mode by default (no Supabase vars). Add VITE_SUPABASE_* to go live.
      VITE_CHEMISTRY_ENGINE_URL: http://localhost:8000

  chemistry-engine:
    build:
      context: ./services/chemistry-engine
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chemlab
      POSTGRES_PASSWORD: chemlab
      POSTGRES_DB: chemlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema applied on first boot. In cloud use Supabase + supabase db push.
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
