[package]
name = "chemlab-desktop"
version = "1.0.0"
description = "ChemLab desktop shell (Tauri)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "chemlab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
